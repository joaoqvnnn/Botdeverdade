services:
  - type: web
    name: bellamy-bot
    runtime: node
    plan: starter
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: BOT_TOKEN
        sync: false
      - key: BOT_USERNAME
        sync: false
      - key: WEBHOOK_URL
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: ADMIN_TELEGRAM_ID
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: bellamy-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: bellamy-redis
          property: connectionString
      - key: SESSION_SECRET
        sync: false
      - key: JWT_SECRET
        sync: false

databases:
  - name: bellamy-db
    plan: starter
    databaseName: bellamy
    user: bellamy

  - name: bellamy-redis
    type: redis
    plan: starter
